# ~/.config/hypr/hyprlock.conf

# Simple solid color background
background {
    monitor =            # empty = all monitors
    color = rgb(15, 15, 26)
}

# Password input field
input-field {
    monitor =
    size = 300, 50
    position = 0, 0
    halign = center
    valign = center

    rounding = 10
    outline_thickness = 2
    inner_color = rgba(20, 20, 30, 0.9)
    outer_color = rgba(120, 120, 255, 1.0)
    font_color = rgb(220, 220, 235)

    fade_on_empty = false
    fail_color = rgb(255, 70, 70)
}
